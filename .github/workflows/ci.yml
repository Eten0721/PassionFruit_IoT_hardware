name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django 測試
    runs-on: ubuntu-latest
    steps:
      # Tests use temp fake weights, so LFS models are not downloaded (saves LFS bandwidth).
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: Django_Server/requirements*.txt
      - name: 安裝依賴
        run: |
          pip install -r Django_Server/requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
          pip install -r Django_Server/requirements.txt
      - name: 執行測試
        working-directory: Django_Server
        run: python -s manage.py test fruit_app

  firmware-compile:
    name: ESP32 編譯
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: 安裝 ESP32 核心與 ESP32Servo
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install ESP32Servo@3.2.1
      - name: 產生 CI 專用假設定
        working-directory: firmware/Three_Gate_Data_Collection
        run: echo 'const char* setupApPassword = "ci-build-only";' > setup.local.h
      - name: 編譯正式 sketch
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/Three_Gate_Data_Collection

  firmware-host:
    name: Firmware host 測試
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 執行 host harness
        shell: pwsh
        run: ./firmware/tests/run_host_tests.ps1

  diff-check:
    name: git diff --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 檢查行尾空白與衝突標記
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          git diff --check "$base" HEAD
