{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>手機 Camera｜百香果資料蒐集</title>
    <link rel="stylesheet" href="{% static 'fruit_app/css/camera.css' %}">
</head>
<body>
<main>
    <video id="local-video" autoplay playsinline muted></video>
    <canvas id="capture-canvas"></canvas>

    <div id="start-panel" class="start-panel">
        <div class="start-box">
            <button id="btn-start-camera" type="button">開啟相機</button>
            <p id="diagnostic" class="hint">安全來源檢查中。請使用 HTTPS 開啟此頁面。</p>
        </div>
    </div>

    <div id="status" class="status">等待開啟相機。</div>
</main>

<script src="{% static 'fruit_app/js/camera.js' %}"></script>
</body>
</html>
