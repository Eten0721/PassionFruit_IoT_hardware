<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>手機 Camera｜百香果資料蒐集</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: #000000;
            color: #ffffff;
            font-family: Arial, "Noto Sans TC", sans-serif;
        }

        main {
            position: fixed;
            inset: 0;
            background: #000000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000000;
        }

        canvas {
            display: none;
        }

        .start-panel {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.72);
        }

        .start-panel.hidden {
            display: none;
        }

        .start-box {
            width: min(88vw, 340px);
            display: grid;
            gap: 12px;
        }

        button {
            min-height: 52px;
            border: 0;
            border-radius: 6px;
            background: #2d7dd2;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
        }

        button:disabled {
            background: #5f6f7a;
        }

        .hint {
            margin: 0;
            color: #d8e0e6;
            font-size: 14px;
            line-height: 1.55;
            text-align: center;
        }

        .status {
            position: absolute;
            left: max(12px, env(safe-area-inset-left));
            right: max(12px, env(safe-area-inset-right));
            bottom: max(12px, env(safe-area-inset-bottom));
            min-height: 28px;
            padding: 8px 10px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.62);
            color: #f4f6f8;
            font-size: 13px;
            line-height: 1.45;
        }
    </style>
</head>
<body>
<main>
    <video id="local-video" autoplay playsinline muted></video>
    <canvas id="capture-canvas"></canvas>

    <div id="start-panel" class="start-panel">
        <div class="start-box">
            <button id="btn-start-camera" type="button">開啟相機</button>
            <p id="diagnostic" class="hint">安全來源檢查中。請使用 HTTPS 開啟此頁面。</p>
        </div>
    </div>

    <div id="status" class="status">等待開啟相機。</div>
</main>

<script>
    const localVideo = document.getElementById('local-video');
    const canvas = document.getElementById('capture-canvas');
    const startPanel = document.getElementById('start-panel');
    const startButton = document.getElementById('btn-start-camera');
    const statusEl = document.getElementById('status');
    const diagnosticEl = document.getElementById('diagnostic');

    let localStream = null;
    let peerConnection = null;
    let currentOfferSdp = null;
    let dashboardIceIndex = 0;
    let lastCaptureToken = 0;
    let lastFailedCaptureToken = 0;
    let lastCaptureFailureTime = 0;
    let isCapturing = false;
    const captureRetryDelayMs = 2000;

    function setStatus(message) {
        statusEl.textContent = message;
    }

    function updateDiagnostic() {
        if (!window.isSecureContext) {
            diagnosticEl.textContent = '非安全來源：手機瀏覽器通常不會開放相機。請使用 https://電腦IP:8000/camera/，並先接受自簽憑證。';
            return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            diagnosticEl.textContent = '此瀏覽器不支援 mediaDevices.getUserMedia，相機無法開啟。';
            return;
        }
        diagnosticEl.textContent = '安全來源已通過。點擊按鈕後，瀏覽器應會詢問相機權限。';
    }

    async function postJson(url, data) {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
            throw new Error(payload.message || `HTTP ${response.status}`);
        }
        return payload;
    }

    async function startCamera() {
        updateDiagnostic();
        if (!window.isSecureContext) {
            setStatus('目前不是安全來源，相機權限不會被瀏覽器開放。');
            return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setStatus('此瀏覽器不支援相機 API。');
            return;
        }

        startButton.disabled = true;
        setStatus('正在向瀏覽器請求相機權限。');
        try {
            if (localStream) {
                localStream.getTracks().forEach((track) => track.stop());
            }
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                    },
                    audio: false,
                });
            } catch (environmentError) {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false,
                });
            }

            localVideo.srcObject = localStream;
            startPanel.classList.add('hidden');
            setStatus('相機已開啟，等待 dashboard 連線與拍攝命令。');
            currentOfferSdp = null;
        } catch (error) {
            setStatus(`相機開啟失敗：${error.name || 'Error'}，${error.message || '請檢查瀏覽器權限設定。'}`);
            startButton.disabled = false;
        }
    }

    function createPeerConnection() {
        if (peerConnection) {
            peerConnection.close();
        }
        dashboardIceIndex = 0;
        peerConnection = new RTCPeerConnection();
        localStream.getTracks().forEach((track) => {
            peerConnection.addTrack(track, localStream);
        });
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                postJson('/api/webrtc/ice', {
                    role: 'camera',
                    candidate: event.candidate.toJSON(),
                }).catch((error) => console.warn('ICE candidate 上傳失敗', error));
            }
        };
        peerConnection.onconnectionstatechange = () => {
            setStatus(`串流狀態：${peerConnection.connectionState}`);
        };
    }

    async function handleWebrtcState(data) {
        if (!localStream || !data.offer) {
            return;
        }

        if (data.offer.sdp !== currentOfferSdp) {
            currentOfferSdp = data.offer.sdp;
            createPeerConnection();
            await peerConnection.setRemoteDescription(data.offer);
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            await postJson('/api/webrtc/answer', {
                answer: {
                    type: peerConnection.localDescription.type,
                    sdp: peerConnection.localDescription.sdp,
                },
            });
            setStatus('已連線 dashboard 即時畫面。');
        }

        const dashboardIce = data.dashboard_ice || [];
        while (dashboardIceIndex < dashboardIce.length && peerConnection) {
            const candidate = dashboardIce[dashboardIceIndex];
            dashboardIceIndex += 1;
            try {
                await peerConnection.addIceCandidate(candidate);
            } catch (error) {
                console.warn('加入 dashboard ICE candidate 失敗', error);
            }
        }
    }

    async function pollWebrtcState() {
        try {
            const response = await fetch('/api/webrtc/state');
            const data = await response.json();
            await handleWebrtcState(data);
        } catch (error) {
            console.warn('WebRTC signaling 同步失敗', error);
        }
    }

    async function pollCaptureState() {
        try {
            const response = await fetch('/api/state/');
            const data = await response.json();
            if (
                data.pending_capture &&
                data.capture_token !== lastCaptureToken &&
                !isCapturing
            ) {
                if (
                    data.capture_token === lastFailedCaptureToken &&
                    Date.now() - lastCaptureFailureTime < captureRetryDelayMs
                ) {
                    return;
                }
                const completed = await captureAndUpload(
                    data.active_fruit_id,
                    data.capture_token,
                    data.capture_interval_ms || 220
                );
                if (completed) {
                    lastCaptureToken = data.capture_token;
                    lastFailedCaptureToken = 0;
                    lastCaptureFailureTime = 0;
                } else {
                    lastFailedCaptureToken = data.capture_token;
                    lastCaptureFailureTime = Date.now();
                }
            }
        } catch (error) {
            console.warn('拍攝狀態同步失敗', error);
        }
    }

    async function captureAndUpload(fruitId, captureToken, captureIntervalMs) {
        if (!localStream) {
            setStatus('尚未開啟相機，無法拍攝。');
            return false;
        }
        isCapturing = true;
        setStatus(`收到 ${fruitId} 拍攝命令，開始連拍 6 張。`);

        try {
            await waitForVideoReady();
            await postJson('/api/capture_started/', {
                fruit_id: fruitId,
                capture_token: captureToken,
            });

            const formData = new FormData();
            formData.append('fruit_id', fruitId);
            formData.append('capture_token', captureToken);
            const captureTimestamps = [];

            for (let index = 1; index <= 6; index += 1) {
                captureTimestamps.push(performance.now());
                const blob = await captureFrameBlob();
                formData.append('images', blob, `img_${String(index).padStart(2, '0')}.jpg`);
                setStatus(`${fruitId} 已拍攝 ${index}/6 張。`);
                if (index < 6 && captureIntervalMs > 0) {
                    await sleep(captureIntervalMs);
                }
            }

            const captureIntervals = [];
            for (let index = 1; index < captureTimestamps.length; index += 1) {
                captureIntervals.push(Number((captureTimestamps[index] - captureTimestamps[index - 1]).toFixed(1)));
            }
            formData.append('capture_meta', JSON.stringify({
                capture_token: captureToken,
                configured_interval_ms: captureIntervalMs,
                timestamps_ms: captureTimestamps.map((value) => Number(value.toFixed(1))),
                intervals_ms: captureIntervals,
            }));

            const response = await fetch('/api/upload_images/', {
                method: 'POST',
                body: formData,
            });
            if (!response.ok) {
                const payload = await response.json().catch(() => ({}));
                throw new Error(payload.message || `HTTP ${response.status}`);
            }
            setStatus(`${fruitId} 六張照片已上傳完成。`);
            return true;
        } catch (error) {
            setStatus(`拍攝或上傳失敗：${error.message}`);
            return false;
        } finally {
            isCapturing = false;
        }
    }

    function waitForVideoReady() {
        if (localVideo.videoWidth > 0 && localVideo.videoHeight > 0) {
            return Promise.resolve();
        }
        return new Promise((resolve) => {
            localVideo.addEventListener('loadedmetadata', resolve, { once: true });
        });
    }

    function captureFrameBlob() {
        canvas.width = localVideo.videoWidth;
        canvas.height = localVideo.videoHeight;
        const context = canvas.getContext('2d');
        context.drawImage(localVideo, 0, 0, canvas.width, canvas.height);
        return new Promise((resolve, reject) => {
            canvas.toBlob((blob) => {
                if (blob) {
                    resolve(blob);
                } else {
                    reject(new Error('瀏覽器無法產生照片 blob。'));
                }
            }, 'image/jpeg', 0.92);
        });
    }

    function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
    }

    updateDiagnostic();
    startButton.addEventListener('click', startCamera);
    setInterval(pollWebrtcState, 500);
    setInterval(pollCaptureState, 150);
</script>
</body>
</html>
