{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>手機 Camera｜百香果資料蒐集</title>
    <link rel="stylesheet" href="{% static 'fruit_app/css/camera.css' %}?v={{ asset_version }}">
</head>
<body>
<main>
    <video id="local-video" autoplay playsinline muted></video>
    <canvas id="capture-canvas"></canvas>

    <div id="start-panel" class="start-panel">
        <div class="start-box">
            <button id="btn-start-camera" type="button">開啟相機</button>
            <p id="diagnostic" class="hint">安全來源檢查中。請使用 HTTPS 開啟此頁面。</p>
        </div>
    </div>

    <div class="bottom-stack">
        <label id="lens-bar" class="lens-bar hidden">鏡頭
            <select id="camera-lens"></select>
        </label>
        <div id="status" class="status">等待開啟相機。</div>
    </div>
    <div id="rtc-status" class="rtc-status" role="status" aria-live="polite">RTC 預覽等待連線；不影響正式照片上傳。</div>
    <details class="camera-diagnostics">
        <summary>驗收資訊</summary>
        <p>更新後可長按複製紀錄。此資訊不代表照片已保存或外網已切斷。</p>
        <button id="btn-camera-diagnostics" type="button">更新驗收資訊</button>
        <label for="camera-diagnostics-output">本次相機診斷紀錄</label>
        <textarea id="camera-diagnostics-output" readonly rows="9" spellcheck="false"></textarea>
    </details>
</main>

<script src="{% static 'fruit_app/js/camera.js' %}?v={{ asset_version }}"></script>
</body>
</html>
