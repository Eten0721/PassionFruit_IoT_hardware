# 百香果分級機硬體參數（維護者專用）
#
# 修改後必須重新啟動 Django 才會生效；ESP32 會在下一次閒置時自動套用。
# 數值不合法時 Django 會拒絕啟動，並指出是哪一個參數。
# 改了送料脈波或最長運轉時間後，請先用 Dashboard 的「測試送料一顆」確認恰好送出一顆。

# 第 1 站停穩時間（ms）｜推薦 300｜50～3000，50 的倍數
first_station_settle_ms = 400

# 伺服放行後穩定時間（ms）｜推薦 200｜50～3000，50 的倍數
servo_settle_ms = 400

# 到下一站停穩時間（ms）｜推薦 350｜50～3000，50 的倍數
fruit_settle_ms = 400

# 第 3 站放行後歸位延遲（ms）｜推薦 300｜0～3000，50 的倍數
final_gate_return_delay_ms = 500

# ESP32 閒置命令輪詢間隔（ms）｜推薦 250｜100～5000，50 的倍數
# 數值越小，分類按鈕反應越快，但 HTTPS 請求越頻繁。
idle_command_poll_interval_ms = 250

# 送料停止脈波（us）｜推薦 1500｜1400～1600，5 的倍數
feeder_stop_us = 1500

# 送料驅動脈波（us）｜推薦 1300｜1000～2000，10 的倍數，不得與停止脈波相同
feeder_drive_us = 1370

# 送料最長運轉時間（ms）｜推薦 5000｜1000～20000，500 的倍數
# 警告：若設定過長將導致連續送料之情形發生。
feeder_max_run_ms = 5000
